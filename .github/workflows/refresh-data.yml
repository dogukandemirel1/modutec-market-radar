name: Refresh market radar data

on:
  schedule:
    # ~08:00 Dubai time daily (Asia/Dubai is UTC+4 year-round, no DST) = ~04:00 UTC.
    # Offset a few minutes past the hour on purpose: GitHub Actions frequently
    # delays or drops scheduled runs queued for exact hour marks (00 minutes)
    # due to load - see https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: "7 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh data.json from RSS feeds
        run: python scripts/refresh_data.py

      - name: Commit and push if data.json changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes to data.json - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: refresh market radar data [skip ci]"
          git push
